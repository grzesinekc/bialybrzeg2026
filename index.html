<body class="bg-[#fcfbf7] text-slate-900 overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const LOCATIONS = [
            "STOŁÓWKA", 
            "DUŻA WIATA", 
            "ŚWIETLICA DOLNA", 
            "ŚWIETLICA GÓRNA", 
            "Altanka pod Sarenką", 
            "Altanka pod Wiewiórką", 
            "Altanka pod Sową", 
            "Altanka pod Lisem",
            "Ognisko na bazie",
            "Ognisko na ewakuacji",
            "Ognisko nad rzeką"
        ];
        
        // Hash for "1BialyBrzeg1"
        const COMMANDANT_HASH = "2b5f928e469557457788937001407768e16e53c457317e6515c65a0c3260c67e";
        
        const IMG_HEADER = "https://www.dropbox.com/scl/fi/h35st6ucsgr0vfaqk599p/IDENTYFIKATOR_BEZ-TEKSTU.png?rlkey=ql6aybqsctxferab69ozyhha9&st=g6ywzqam&dl=1";
        const IMG_LOGO = "https://www.dropbox.com/scl/fi/zr8lckek34w630una7jgc/logo-BB.jpg?rlkey=i605zzig81x7l8ji5yhyyiu5y&st=mrxsxpti&dl=1";
        const IMG_MAP = "https://www.dropbox.com/scl/fi/69o9otia5gqlj9st1uw71/BB2026.png?rlkey=24lpkefyyrjc3u52pnfy5km6r&raw=1";

        const EXCEL_URL = "https://www.dropbox.com/scl/fi/pgs03zqspj2s8xz4ybife/Profesjonalny_arkusz_osobodni_oboz_harcerski_v3.xlsx?rlkey=jtfrfokklz7g3ilkhqvdd5gmj";

        const BP_QUOTES = [
            { text: "Zostawcie ten świat choć trochę lepszym, niż go zastaliście.", author: "Robert Baden-Powell" },
            { text: "Najprawdziwsza ścieżka do szczęścia to dawanie go innym.", author: "Robert Baden-Powell" },
            { text: "Skauting to wielka gra.", author: "Robert Baden-Powell" },
            { text: "Bądź gotów!", author: "Robert Baden-Powell" },
            { text: "Patrz szerzej, a gdy już patrzysz szeroko, popatrz jeszcze szerzej.", author: "Robert Baden-Powell" },
            { text: "Harcerstwo to nie jest coś, co się umie, ale czym się jest.", author: "Andrzej Małkowski" },
            { text: "Wszystko co polskie – ukochać, wszystko co prawe i szlachetne – w czyn zamieniać.", author: "Andrzej Małkowski" },
            { text: "Mocą i bogactwem narodu są wolni i silni ludzie o niezłomnych charakterach.", author: "Andrzej Małkowski" },
            { text: "Skauting to nie tylko zabawa, to czynna służba drugiemu człowiekowi.", author: "Andrzej Małkowski" },
            { text: "Każdy dzień bez dobrego uczynku jest dniem bezpowrotnie straconym.", author: "Andrzej Małkowski" }
        ];

        async function sha256(message) {
            try {
                const msgBuffer = new TextEncoder().encode(message);
                const hashBuffer = await crypto.subtle.digest('SHA-2-256', msgBuffer);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            } catch (e) {
                return null;
            }
        }

        const formatCellValue = (cell) => {
            if (cell === null || cell === undefined) return '';
            
            if (typeof cell === 'number' && cell > 40000 && cell < 50000) {
                try {
                    const jsDate = new Date((cell - 25569) * 86400 * 1000);
                    if (!isNaN(jsDate.getTime())) {
                        const y = jsDate.getUTCFullYear();
                        const m = String(jsDate.getUTCMonth() + 1).padStart(2, '0');
                        const d = String(jsDate.getUTCDate()).padStart(2, '0');
                        return `${y}-${m}-${d}`;
                    }
                } catch (e) {}
            }
            
            if (cell instanceof Date) {
                if (!isNaN(cell.getTime())) {
                    const y = cell.getFullYear();
                    const m = String(cell.getMonth() + 1).padStart(2, '0');
                    const d = String(cell.getDate()).padStart(2, '0');
                    return `${y}-${m}-${d}`;
                }
            }
            return String(cell);
        };

        const findColumnIdx = (header, positiveKeywords, negativeKeywords = []) => {
            return header.findIndex(h => {
                const val = String(h || '').toLowerCase();
                const matchesPositive = positiveKeywords.some(kw => val.includes(kw));
                const matchesNegative = negativeKeywords.some(kw => val.includes(kw));
                return matchesPositive && !matchesNegative;
            });
        };

        function App() {
            const [activeTab, setActiveTab] = useState('home');
            const [currentTime, setCurrentTime] = useState(new Date());
            const [reservations, setReservations] = useState([]);
            const [extraContent, setExtraContent] = useState({ 
                jadlospis: '', 
                kontakt: '', 
                wycieczki: '' 
            });
            const [isBookingModalOpen, setIsBookingModalOpen] = useState(false);
            const [isJadlospisEditing, setIsJadlospisEditing] = useState(false);
            const [tempJadlospis, setTempJadlospis] = useState('');
            const [passwordInput, setPasswordInput] = useState('');
            const [bookingError, setBookingError] = useState(null);
            const [db, setDb] = useState(null);
            const [user, setUser] = useState(null);
            const [error, setError] = useState(null);
            const [isInit, setIsInit] = useState(false);

            const [excelData, setExcelData] = useState(null); 
            const [selectedSheet, setSelectedSheet] = useState('');
            const [excelLoading, setExcelLoading] = useState(true);
            const [excelError, setExcelError] = useState(null);
            const [excelSearch, setExcelSearch] = useState('');
            const fileInputRef = useRef(null);

            const appId = typeof __app_id !== 'undefined' ? __app_id : 'stanica-bialy-brzeg';

            const getTodayDateStr = (date) => {
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            };

            const getTimeStr = (date) => {
                const hours = String(date.getHours()).padStart(2, '0');
                const minutes = String(date.getMinutes()).padStart(2, '0');
                return `${hours}:${minutes}`;
            };

            const dailyQuote = useMemo(() => {
                const dayOfYear = Math.floor((currentTime - new Date(currentTime.getFullYear(), 0, 0)) / (1000 * 60 * 60 * 24));
                return BP_QUOTES[dayOfYear % BP_QUOTES.length];
            }, [getTodayDateStr(currentTime)]);

            const isReservationActive = (date, timeEnd) => {
                if (!date || !timeEnd) return true;
                const todayStr = getTodayDateStr(currentTime);
                const nowTimeStr = getTimeStr(currentTime);
                const rDate = date.trim();
                const rTimeEnd = timeEnd.trim();

                if (rDate > todayStr) return true;
                if (rDate === todayStr && rTimeEnd > nowTimeStr) return true;
                return false;
            };

            const convertDropboxUrl = (url) => {
                if (!url) return '';
                let newUrl = url;
                newUrl = newUrl.replace('www.dropbox.com', 'dl.dropboxusercontent.com');
                const urlObj = new URL(newUrl);
                urlObj.searchParams.set('raw', '1');
                urlObj.searchParams.delete('dl');
                urlObj.searchParams.delete('st');
                return urlObj.toString();
            };

            const parseExcelBuffer = (buffer) => {
                try {
                    const data = new Uint8Array(buffer);
                    const workbook = XLSX.read(data, { type: 'array', cellDates: true });
                    const sheetsData = {};
                    
                    workbook.SheetNames.forEach(name => {
                        const worksheet = workbook.Sheets[name];
                        const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });
                        sheetsData[name] = rows.filter(row => row.some(cell => cell !== '')); 
                    });
                    
                    setExcelData({
                        sheetNames: workbook.SheetNames,
                        sheets: sheetsData
                    });
                    setSelectedSheet(workbook.SheetNames[0]);
                    setExcelLoading(false);
                } catch (err) {
                    console.error("Błąd parsowania:", err);
                    setExcelError("Wystąpił błąd podczas analizy struktury pliku Excel.");
                    setExcelLoading(false);
                }
            };

            const loadExcelFromDropbox = async () => {
                setExcelLoading(true);
                setExcelError(null);
                try {
                    const directUrl = convertDropboxUrl(EXCEL_URL);
                    const response = await fetch(directUrl);
                    if (!response.ok) throw new Error("Odpowiedź sieciowa nie była prawidłowa.");
                    const arrayBuffer = await response.arrayBuffer();
                    parseExcelBuffer(arrayBuffer);
                } catch (err) {
                    console.error("Błąd ładowania z Dropbox:", err);
                    setExcelError("Nie udało się automatycznie połączyć z Dropbox. Możesz załadować plik ręcznie!");
                    setExcelLoading(false);
                }
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setExcelLoading(true);
                setExcelError(null);
                const reader = new FileReader();
                reader.onload = (event) => {
                    parseExcelBuffer(event.target.result);
                };
                reader.onerror = () => {
                    setExcelError("Wystąpił błąd podczas odczytywania przesłanego pliku.");
                    setExcelLoading(false);
                };
                reader.readAsArrayBuffer(file);
            };

            useEffect(() => {
                if (activeTab === 'osobodni') {
                    loadExcelFromDropbox();
                }
            }, [activeTab]);

            useEffect(() => {
                const startApp = async () => {
                    if (!window.fb) return;
                    try {
                        const app = window.fb.initializeApp(window.fb.firebaseConfig);
                        const database = window.fb.getFirestore(app);
                        const auth = window.fb.getAuth(app);
                        setDb(database);
                        const initAuth = async () => {
                            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                                await window.fb.signInWithCustomToken(auth, __initial_auth_token);
                            } else {
                                await window.fb.signInAnonymously(auth);
                            }
                        };
                        await initAuth();
                        window.fb.onAuthStateChanged(auth, (currUser) => {
                            setUser(currUser);
                            setIsInit(true);
                        });
                    } catch (err) {
                        setError(err.message);
                    }
                };
                startApp();
            }, []);

            useEffect(() => {
                if (!db || !user) return;
                const resCol = window.fb.collection(db, 'artifacts', appId, 'public', 'data', 'reservations');
                const contentDoc = window.fb.doc(db, 'artifacts', appId, 'public', 'data', 'content', 'main');
                const unsubRes = window.fb.onSnapshot(resCol, (snap) => {
                    setReservations(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                }, (err) => setError("Błąd bazy danych. Sprawdź połączenie."));
                const unsubContent = window.fb.onSnapshot(contentDoc, (snap) => {
                    if (snap.exists()) {
                        const data = snap.data();
                        setExtraContent(prev => ({ 
                            ...data, 
                            kontakt: prev.kontakt 
                        }));
                    }
                });
                return () => { unsubRes(); unsubContent(); };
            }, [db, user, appId]);

            useEffect(() => {
                const t = setInterval(() => setCurrentTime(new Date()), 1000);
                return () => clearInterval(t);
            }, []);

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [activeTab, isInit, isBookingModalOpen, excelLoading, excelError]);

            const handleAdd = async (e) => {
                e.preventDefault();
                setBookingError(null);
                if (!user || !db) return;

                const formData = {
                    location: e.target.location.value,
                    group: e.target.group.value,
                    timeStart: e.target.timeStart.value,
                    timeEnd: e.target.timeEnd.value,
                    date: e.target.date.value,
                    createdAt: Date.now()
                };

                // Połączenie wybranej daty i godziny rozpoczęcia w jeden obiekt czasu lokalnego
                const reservationStart = new Date(`${formData.date}T${formData.timeStart}`);
                const now = new Date();
                const timeDiffMs = reservationStart.getTime() - now.getTime();

                // Walidacja 1: Sprawdzenie rezerwacji wstecz
                if (timeDiffMs < 0) {
                    setBookingError("Nie można dokonać rezerwacji wstecz!");
                    return;
                }

                // Walidacja 2: Rezerwacja wybiegająca ponad 24 godziny w przyszłość
                const maxAdvanceMs = 24 * 60 * 60 * 1000; // 24 godziny w milisekundach
                if (timeDiffMs > maxAdvanceMs) {
                    setBookingError("Rezerwacji wybranego miejsca można dokonać maksymalnie na 24 godziny przed jej rozpoczęciem!");
                    return;
                }
                
                const activeRes = reservations.filter(r => isReservationActive(r.date, r.timeEnd));
                const conflict = activeRes.find(res => 
                    res.location === formData.location && 
                    res.date === formData.date && 
                    ((formData.timeStart < res.timeEnd && formData.timeEnd > res.timeStart))
                );
                
                if (conflict) {
                    setBookingError(`To miejsce jest już zajęte przez: ${conflict.group}`);
                    return;
                }
                
                try {
                    const resCol = window.fb.collection(db, 'artifacts', appId, 'public', 'data', 'reservations');
                    await window.fb.addDoc(resCol, formData);
                    setIsBookingModalOpen(false);
                } catch (err) { setBookingError("Błąd zapisu w bazie."); }
            };

            const updateContent = async (key, val) => {
                if (!db || !user) return;
                const contentDoc = window.fb.doc(db, 'artifacts', appId, 'public', 'data', 'content', 'main');
                await window.fb.setDoc(contentDoc, { ...extraContent, [key]: val }, { merge: true });
            };

            const deleteReservation = async (id) => {
                if (!user || !db) return;
                const resDoc = window.fb.doc(db, 'artifacts', appId, 'public', 'data', 'reservations', id);
                await window.fb.deleteDoc(resDoc);
            }

            const checkPassword = async (e) => {
                e.preventDefault();
                const cleanInput = passwordInput.trim();
                const hashedInput = await sha256(cleanInput);
                
                if (hashedInput === COMMANDANT_HASH || cleanInput === "1BialyBrzeg1") {
                    setTempJadlospis(extraContent.jadlospis || '');
                    setIsJadlospisEditing(true);
                    setPasswordInput('');
                } else {
                    setPasswordInput('');
                }
            };

            const handleSaveJadlospis = async () => {
                await updateContent('jadlospis', tempJadlospis);
                setIsJadlospisEditing(false);
            };

            const currentSheetGrid = useMemo(() => {
                if (!excelData || !selectedSheet) return [];
                return excelData.sheets[selectedSheet] || [];
            }, [excelData, selectedSheet]);

            const headerRowDetection = useMemo(() => {
                if (currentSheetGrid.length === 0) {
                    return { header: [], body: [] };
                }

                const keyTerms = [
                    "lp", "data", "termin", "drużyna", "obóz", "nazwisko", "imię", "osoba", "osoby",
                    "uczestnic", "kadra", "razem", "suma", "łącznie", "osobodni", "osobo-dni", "pobyt"
                ];

                let bestRowIdx = 0;
                let maxMatches = -1;

                const scanRange = Math.min(15, currentSheetGrid.length);
                for (let r = 0; r < scanRange; r++) {
                    const row = currentSheetGrid[r] || [];
                    let matches = 0;
                    row.forEach(cell => {
                        const cellVal = String(cell || '').toLowerCase();
                        if (keyTerms.some(term => cellVal.includes(term))) {
                            matches++;
                        }
                    });
                    if (matches > maxMatches) {
                        maxMatches = matches;
                        bestRowIdx = r;
                    }
                }

                const header = currentSheetGrid[bestRowIdx] || [];
                const body = currentSheetGrid.slice(bestRowIdx + 1).filter(row => {
                    return row.some(cell => cell !== '') && row !== header;
                });

                return { header, body };
            }, [currentSheetGrid]);

            const sheetHeaderRow = useMemo(() => headerRowDetection.header, [headerRowDetection]);

            const sheetBodyRows = useMemo(() => {
                const body = headerRowDetection.body;
                if (!excelSearch) return body;
                return body.filter(row => 
                    row.some(cell => String(cell).toLowerCase().includes(excelSearch.toLowerCase()))
                );
            }, [headerRowDetection, excelSearch]);

            const computedExcelTotals = useMemo(() => {
                if (sheetHeaderRow.length === 0 || sheetBodyRows.length === 0) {
                    return { uczestnicy: 0, kadra: 0, razem: 0, osobodni: 0 };
                }

                const uIdx = findColumnIdx(sheetHeaderRow, ["uczestnic", "dzieci", "harcerz", "pionier"], ["osobodni", "kadra", "kadr"]);
                const kIdx = findColumnIdx(sheetHeaderRow, ["kadra", "kadr", "opiekun", "wychowaw"], ["osobodni", "uczestni"]);
                const rIdx = findColumnIdx(sheetHeaderRow, ["razem", "suma", "łącznie", "stan", "ilość osób", "liczba osób"], ["osobodni", "uczestni", "kadra"]);
                const oIdx = findColumnIdx(sheetHeaderRow, ["osobodni", "osobo-dni", "osobo dni"], []);

                const detailRows = sheetBodyRows.filter(row => {
                    if (!row) return false;
                    return !row.some(cell => {
                        const val = String(cell || '').toLowerCase().trim().replace(/[:]/g, '');
                        return val === 'suma' || 
                               val === 'razem' || 
                               val === 'ogółem' || 
                               val === 'łącznie' || 
                               val === 'podsumowanie' || 
                               val === 'suma końcowa' ||
                               val.startsWith('suma ');
                    });
                });

                const sumCol = (idx) => {
                    if (idx === -1) return 0;
                    return detailRows.reduce((sum, row) => {
                        const cellVal = row[idx];
                        if (cellVal === undefined || cellVal === null) return sum;
                        if (cellVal instanceof Date) return sum;
                        const num = parseFloat(String(cellVal).replace(/\s/g, '').replace(',', '.'));
                        return isNaN(num) ? sum : sum + num;
                    }, 0);
                };

                return {
                    uczestnicy: sumCol(uIdx),
                    kadra: sumCol(kIdx),
                    razem: sumCol(rIdx),
                    osobodni: sumCol(oIdx)
                };
            }, [sheetHeaderRow, sheetBodyRows]);

            if (error) return (
                <div className="min-h-screen bg-red-50 flex flex-col items-center justify-center p-6 text-center">
                    <div className="bg-white p-12 rounded-[3rem] shadow-2xl border-4 border-red-100 max-w-xl w-full">
                        <img src={IMG_LOGO} className="w-20 h-20 mx-auto mb-6 rounded-full" />
                        <h2 className="text-red-600 font-black text-3xl mb-4 italic uppercase leading-none">Błąd Synchronizacji</h2>
                        <button onClick={() => window.location.reload()} className="w-full bg-slate-900 text-white py-4 rounded-2xl font-black uppercase tracking-widest mt-6">Odśwież</button>
                    </div>
                </div>
            );
            
            if (!isInit) return (
                <div className="min-h-screen bg-[#064e3b] flex flex-col items-center justify-center text-white font-black italic">
                    <img src={IMG_LOGO} alt="Logo" className="w-32 h-32 rounded-full mb-8 animate-pulse border-4 border-white/20" />
                    <div className="tracking-widest uppercase text-xs">Synchronizacja z chmurą...</div>
                </div>
            );

            return (
                <div className="min-h-screen pb-10 selection:bg-emerald-200">
                    <header className="bg-emerald-950 text-white p-8 md:p-24 relative overflow-hidden bg-cover bg-center" style={{ backgroundImage: `url('${IMG_HEADER}')` }}>
                        <div className="absolute inset-0 bg-emerald-950/85 backdrop-blur-[2px]"></div>
                        <div className="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-10 relative z-10">
                            <div className="flex flex-col md:flex-row items-center gap-10 text-center md:text-left">
                                <img src={IMG_LOGO} alt="Logo BB" className="w-24 h-24 md:w-36 md:h-36 rounded-full border-4 border-white/20 shadow-2xl" />
                                <div>
                                    <h1 className="text-5xl md:text-7xl font-black italic tracking-tighter leading-none">BIAŁY BRZEG 2026</h1>
                                    <div className="mt-4 max-w-lg">
                                        <p className="text-emerald-300 font-bold italic text-lg leading-tight">"{dailyQuote.text}"</p>
                                        <p className="text-emerald-500/60 font-black uppercase tracking-[0.4em] text-[8px] mt-2 italic">{dailyQuote.author}</p>
                                    </div>
                                </div>
                            </div>
                            <div className="bg-black/40 p-10 rounded-[3.5rem] text-center border border-white/10 backdrop-blur-3xl min-w-[280px]">
                                <div className="text-7xl font-mono font-black text-emerald-300 tracking-tighter tabular-nums leading-none">{getTimeStr(currentTime)}</div>
                                <div className="text-[10px] font-black uppercase tracking-[0.5em] opacity-40 mt-4 italic text-emerald-100">{currentTime.toLocaleDateString('pl-PL', { weekday: 'long', day: 'numeric', month: 'long' })}</div>
                            </div>
                        </div>
                    </header>

                    {}
                    <nav className="max-w-6xl mx-auto -mt-10 px-4 sticky top-6 z-40">
                        <div className="bg-white/95 backdrop-blur-md rounded-[2.5rem] shadow-2xl border border-emerald-100 p-2 flex overflow-x-auto no-scrollbar gap-1">
                            {['home', 'rezerwacje', 'jadlospis', 'wycieczki', 'osobodni', 'kontakt'].map(tab => (
                                <button key={tab} onClick={() => setActiveTab(tab)} className={`flex items-center gap-2 px-6 py-5 rounded-[1.8rem] transition-all flex-1 justify-center whitespace-nowrap ${activeTab === tab ? 'bg-emerald-600 text-white shadow-xl scale-[1.02] font-black' : 'text-emerald-900/40 hover:bg-emerald-50 font-bold'}`}>
                                    <i data-lucide={
                                        tab === 'home' ? 'home' :
